<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bharat Scheme — family welfare eligibility</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#10233F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Gujarati:wght@400;600;700&family=Noto+Sans+Gurmukhi:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&family=Noto+Sans+Meetei+Mayek:wght@400;600;700&family=Noto+Sans+Ol+Chiki:wght@400;600;700&family=Noto+Sans+Oriya:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :lang(hi), :lang(mr), :lang(ne), :lang(sa), :lang(mai), :lang(kok), :lang(brx), :lang(doi) {
        font-family: 'Noto Sans Devanagari', var(--f-body, system-ui, sans-serif);
      }
      :lang(bn), :lang(as) {
        font-family: 'Noto Sans Bengali', var(--f-body, system-ui, sans-serif);
      }
      :lang(gu) {
        font-family: 'Noto Sans Gujarati', var(--f-body, system-ui, sans-serif);
      }
      :lang(pa) {
        font-family: 'Noto Sans Gurmukhi', var(--f-body, system-ui, sans-serif);
      }
      :lang(kn) {
        font-family: 'Noto Sans Kannada', var(--f-body, system-ui, sans-serif);
      }
      :lang(ml) {
        font-family: 'Noto Sans Malayalam', var(--f-body, system-ui, sans-serif);
      }
      :lang(or) {
        font-family: 'Noto Sans Oriya', var(--f-body, system-ui, sans-serif);
      }
      :lang(te) {
        font-family: 'Noto Sans Telugu', var(--f-body, system-ui, sans-serif);
      }
      :lang(sat) {
        font-family: 'Noto Sans Ol Chiki', var(--f-body, system-ui, sans-serif);
      }
      :lang(mni) {
        font-family: 'Noto Sans Meetei Mayek', var(--f-body, system-ui, sans-serif);
      }
      :lang(ur), :lang(ks), :lang(sd) {
        font-family: 'Noto Nastaliq Urdu', 'Noto Sans Arabic', var(--f-body, system-ui, sans-serif);
      }
      [dir="rtl"] {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
